# Compose >= 2.24.4. Explicitly select this override; it never changes local development by default.
services:
  frontend:
    restart: unless-stopped
    ports: !override
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-64430}:443"
    volumes:
      - ./ops/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_FILE:?Set TLS_CERTIFICATE_FILE}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_FILE:?Set TLS_PRIVATE_KEY_FILE}:/etc/nginx/tls/private.key:ro
  db:
    restart: unless-stopped
    ports: !reset []
  mail:
    profiles: [development-mail]
    ports: !reset []
  backend:
    restart: unless-stopped
    ports: !reset []
    depends_on: !override
      db:
        condition: service_healthy
    environment:
      COOKIE_SECURE: "true"
      SIGNING_ALLOW_HTTP: "false"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set an HTTPS APP_PUBLIC_URL including port 64430}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SMTP_HOST: ${SMTP_HOST:?Set the institutional SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
