spring:
  application:
    name: utaped
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/utaped}
    username: ${DB_USER:utaped}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_BYTES:10485760}B
      max-request-size: ${DOCUMENT_MAX_REQUEST_BYTES:12582912}B
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp:
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
        auth: ${SMTP_AUTH:false}
        starttls.enable: ${SMTP_STARTTLS:false}
        ssl.enable: ${SMTP_SSL:false}
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  ai-writing:
    enabled: ${AI_WRITING_ENABLED:false}
    provider: ${AI_WRITING_PROVIDER:GROQ}
    model: ${AI_WRITING_MODEL:}
    groq-key: ${GROQ_API_KEY:}
    openai-key: ${OPENAI_API_KEY:}
    timeout-seconds: ${AI_WRITING_TIMEOUT_SECONDS:30}
    max-input-characters: ${AI_WRITING_MAX_INPUT_CHARACTERS:8000}
    max-output-tokens: ${AI_WRITING_MAX_OUTPUT_TOKENS:2000}
    user-limit: ${AI_WRITING_USER_LIMIT:15}
    concurrency: ${AI_WRITING_CONCURRENCY:2}
  notifications:
    deadline-enabled: ${DEADLINE_NOTICES_ENABLED:true}
    deadline-near-days: ${DEADLINE_NOTICE_NEAR_DAYS:3}
    missing-repeat-days: ${DEADLINE_NOTICE_REPEAT_DAYS:1}
    deadline-scan-ms: ${DEADLINE_NOTICE_SCAN_MS:3600000}
  periods:
    archive-max-bytes: ${PERIOD_ARCHIVE_MAX_BYTES:134217728}
  signing:
    allow-http: ${SIGNING_ALLOW_HTTP:false}
  audit:
    export-max-rows: ${AUDIT_EXPORT_MAX_ROWS:10000}
  documents:
    storage-root: ${DOCUMENT_STORAGE_ROOT:./runtime-data/documents}
    max-file-bytes: ${DOCUMENT_MAX_FILE_BYTES:10485760}
    max-total-bytes: ${DOCUMENT_MAX_TOTAL_BYTES:52428800}
    max-attachments: ${DOCUMENT_MAX_ATTACHMENTS:20}
    max-attachment-pages: ${DOCUMENT_MAX_ATTACHMENT_PAGES:100}
    page-format: ${DOCUMENT_PAGE_FORMAT:A4}
  public-url: ${APP_PUBLIC_URL:http://localhost:64430}
  mail-from: ${MAIL_FROM:no-reply@utaped.invalid}
  planning:
    max-extension-days: ${PLANNING_MAX_EXTENSION_DAYS:3}
    allow-legacy-creation: false
    single-plan-per-scope: ${PLANNING_SINGLE_PLAN_PER_SCOPE:false}
    enforce-preparation-window: ${PLANNING_ENFORCE_PREPARATION_WINDOW:true}
    time-zone: ${PLANNING_TIME_ZONE:America/Guayaquil}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
