spring:
  application:
    name: utaped
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/utaped}
    username: ${DB_USER:utaped}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp:
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
        auth: ${SMTP_AUTH:false}
        starttls.enable: ${SMTP_STARTTLS:false}
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@utaped.invalid}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
