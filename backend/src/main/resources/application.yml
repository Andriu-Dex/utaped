spring:
  application:
    name: utaped
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/utaped}
    username: ${DB_USER:utaped}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_BYTES:10485760}B
      max-request-size: ${DOCUMENT_MAX_REQUEST_BYTES:12582912}B
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp:
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
        auth: ${SMTP_AUTH:false}
        starttls.enable: ${SMTP_STARTTLS:false}
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  signing:
    allow-http: ${SIGNING_ALLOW_HTTP:false}
  audit:
    export-max-rows: ${AUDIT_EXPORT_MAX_ROWS:10000}
  documents:
    storage-root: ${DOCUMENT_STORAGE_ROOT:./runtime-data/documents}
    max-file-bytes: ${DOCUMENT_MAX_FILE_BYTES:10485760}
    max-total-bytes: ${DOCUMENT_MAX_TOTAL_BYTES:52428800}
    max-attachments: ${DOCUMENT_MAX_ATTACHMENTS:20}
    max-attachment-pages: ${DOCUMENT_MAX_ATTACHMENT_PAGES:100}
    page-format: ${DOCUMENT_PAGE_FORMAT:A4}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@utaped.invalid}
  planning:
    single-plan-per-scope: ${PLANNING_SINGLE_PLAN_PER_SCOPE:false}
    enforce-preparation-window: ${PLANNING_ENFORCE_PREPARATION_WINDOW:true}
    time-zone: ${PLANNING_TIME_ZONE:America/Guayaquil}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
