server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ ^/api/admin/periods/[a-fA-F0-9-]+/custody-verification$ {
        # This streaming, ADMIN-only endpoint verifies the private ZIP (backend cap: 512 MiB).
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        client_max_body_size 12m;
        proxy_read_timeout 180s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
