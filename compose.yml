name: utaped
services:
  frontend:
    profiles: [web]
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      - backend
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: utaped
      POSTGRES_USER: utaped
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U utaped -d utaped"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/utaped
      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      SMTP_HOST: mail
      PLANNING_SINGLE_PLAN_PER_SCOPE: ${PLANNING_SINGLE_PLAN_PER_SCOPE:-false}
      PLANNING_ENFORCE_PREPARATION_WINDOW: ${PLANNING_ENFORCE_PREPARATION_WINDOW:-true}
      PLANNING_TIME_ZONE: ${PLANNING_TIME_ZONE:-America/Guayaquil}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
volumes:
  postgres-data:
